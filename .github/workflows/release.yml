name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.0). Empty = Info.plist / tag.'
        required: false
        default: ''
      notarize:
        description: 'Force notarization attempt (needs Apple secrets)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Package macOS Universal
    runs-on: macos-14
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT" ]]; then
            VER="$INPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/App/Info.plist)"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VER}"

      - name: Import Developer ID (optional)
        id: cert
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./Scripts/ci_import_cert.sh

      - name: Prepare notarization key (optional)
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [[ -n "${APPLE_API_KEY_BASE64:-}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
            echo "Has App Store Connect API key"
          else
            echo "No APPLE_API_KEY_BASE64 — notarize via APPLE_ID if provided"
          fi

      - name: Universal build + DMG/ZIP
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: '1'
          ASSET_SUFFIX: macos-universal
          FORCE_NOTARIZE: ${{ github.event.inputs.notarize }}
        run: |
          set -euo pipefail
          # CODESIGN_IDENTITY may be set by ci_import_cert via GITHUB_ENV
          if [[ -z "${CODESIGN_IDENTITY:-}" ]]; then
            export CODESIGN_IDENTITY="-"
          fi
          echo "CODESIGN_IDENTITY=${CODESIGN_IDENTITY}"

          export DO_NOTARIZE=0
          if [[ "${FORCE_NOTARIZE}" == "true" ]]; then
            export DO_NOTARIZE=1
          elif [[ "${GITHUB_REF_TYPE}" == "tag" \
              && "${CODESIGN_IDENTITY}" != "-" \
              && ( -n "${APPLE_API_KEY_ID:-}" || -n "${APPLE_ID:-}" ) ]]; then
            export DO_NOTARIZE=1
          fi
          echo "DO_NOTARIZE=${DO_NOTARIZE}"

          ./Scripts/ci_package.sh "${{ steps.meta.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meolaunch-macos-${{ steps.meta.outputs.version }}
          path: |
            dist/MeoLaunch-*.dmg
            dist/MeoLaunch-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## meoLaunch ${VER}"
            echo ""
            echo "macOS 13+ Universal（Apple Silicon + Intel）"
            echo ""
            echo "### Downloads"
            echo "- \`MeoLaunch-${VER}-macos-universal.dmg\` — recommended (installer helper inside)"
            echo "- \`MeoLaunch-${VER}-macos-universal.zip\` — app only"
            echo ""
            echo "Checksums: \`SHA256SUMS.txt\`"
            echo ""
            echo "If Gatekeeper blocks: open the DMG → right-click 「一键安装并授权.command」→ Open."
          } >"$NOTES"

          FILES=(
            "dist/MeoLaunch-${VER}-macos-universal.dmg"
            "dist/MeoLaunch-${VER}-macos-universal.zip"
            "dist/MeoLaunch-${VER}.dmg"
            "dist/MeoLaunch-${VER}.zip"
            "dist/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "meoLaunch ${VER}" \
              --notes-file "$NOTES" \
              --target "${GITHUB_SHA}"
          fi

  release-website:
    name: Package website
    runs-on: ubuntu-latest
    needs: release-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
        env:
          PUBLIC_SITE_URL: http://www.meofind.top/meolaunch
          PUBLIC_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/MeoLaunch-${{ needs.release-macos.outputs.version }}-macos-universal.dmg

      - name: Zip website dist
        run: |
          ZIP="meolaunch-website-${{ needs.release-macos.outputs.version }}.zip"
          rm -f "$ZIP"
          (cd website/dist && zip -r "../../${ZIP}" .)
          ls -lh "$ZIP"

      - name: Attach website zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-macos.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "meolaunch-website-${{ needs.release-macos.outputs.version }}.zip" \
            --clobber
