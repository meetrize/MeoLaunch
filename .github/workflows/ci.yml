name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'doc/**'
      - 'website/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'website/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (host arch)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./Scripts/build.sh

      - name: Smoke — binary exists
        run: |
          test -x build/MeoLaunch.app/Contents/MacOS/MeoLaunch
          lipo -info build/MeoLaunch.app/Contents/MacOS/MeoLaunch
          file build/MeoLaunch.app/Contents/MacOS/MeoLaunch

      - name: Core unit smoke (optional scripts)
        run: |
          if [[ -x ./Scripts/build_core.sh ]]; then
            ./Scripts/build_core.sh
          fi

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build
        env:
          PUBLIC_SITE_URL: http://www.meofind.top/meolaunch

      - name: Upload website dist
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error
